{# Tela Inicial — Login (protótipo do UC1, ERSw 3.4.1) #}
{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="cartao cartao-login">
  <h1>Tela Inicial — Login</h1>
  <form method="post" action="{{ url_for('autenticacao.autenticar') }}">
    <label for="email">E-mail*</label>
    <input type="email" id="email" name="email" required
           placeholder="joao@condominio.com" value="{{ email or '' }}">

    <label for="senha">Senha*</label>
    <input type="password" id="senha" name="senha" required
           minlength="8" placeholder="mínimo 8 caracteres">

    <button type="submit" class="botao botao-primario">Entrar</button>
  </form>
</section>
{% endblock %}
